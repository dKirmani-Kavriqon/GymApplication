# Single-server production stack: Caddy (TLS + dashboard) → API (SQLite on a volume) + Litestream backups.
#   cp .env.example .env   # fill in real values
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
name: gymverse

services:
  # Restores the newest backup before the API starts if the volume is empty (new server / disaster recovery).
  restore:
    image: litestream/litestream:0.3.13
    command: restore -if-db-not-exists -if-replica-exists /data/gymverse.db
    env_file: ../.env
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: ../.env
    environment:
      NODE_ENV: production
      DB_PATH: /data/gymverse.db
      TRUST_PROXY: "true"
    volumes:
      - data:/data
    depends_on:
      restore:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  backup:
    image: litestream/litestream:0.3.13
    command: replicate
    env_file: ../.env
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: https://${API_HOST}
    env_file: ../.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
