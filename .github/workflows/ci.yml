name: CI

# Tests on every push and PR. Pushes to main also deploy STAGING to Cloudflare.
# PRODUCTION deploys only when you run this workflow by hand (Actions → CI → Run workflow →
# target: production), behind the `production` environment's required reviewers.
#
# Repository secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Repository variables: STAGING_API_URL, PRODUCTION_API_URL (the API's public https URL)
# Worker secrets (TOKEN_SECRET, Razorpay, MSG91, …) are set once with `wrangler secret put`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.inputs.target || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests with coverage (shared, api, dashboard, mobile)
        run: npm run test:coverage
      - name: Build dashboard
        run: npm run build -w @gymverse/dashboard
        env:
          VITE_API_URL: https://api.example.com
      - name: Bundle member app for web (catches Metro/import errors)
        run: npx expo export --platform web --output-dir /tmp/web-export
        working-directory: apps/mobile
      - name: Audit production dependencies (API, dashboard, shared, member app)
        run: npm audit --omit=dev --audit-level=high -w @gymverse/api -w @gymverse/dashboard -w @gymverse/shared -w @gymverse/mobile

  workerd:
    name: API on the Cloudflare runtime (local workerd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Database driver checks in a Durable Object + end-to-end smoke test
        run: npm run test:worker -w @gymverse/api
      - name: Bundle the production Worker
        run: npx wrangler deploy --dry-run --env="" --outdir /tmp/worker
        working-directory: apps/api

  deploy-staging:
    needs: [test, workerd]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check settings
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add the CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$API_URL" || { echo "Add the STAGING_API_URL variable"; exit 1; }
      - name: Deploy API
        run: npx wrangler deploy --env staging --var PUBLIC_API_URL:"$API_URL"
        working-directory: apps/api
      - name: Build and deploy dashboard
        run: npm run build:cloudflare && npx wrangler deploy --env staging
        working-directory: apps/dashboard
        env:
          VITE_API_URL: ${{ vars.STAGING_API_URL }}
      - name: Build and deploy member web app
        run: npm run build:cloudflare && npx wrangler deploy --env staging
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
      - name: Smoke test staging
        run: npm run smoke -w @gymverse/api -- "$API_URL"

  deploy-production:
    needs: [test, workerd]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check settings
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add the CLOUDFLARE_API_TOKEN secret"; exit 1; }
          case "$API_URL" in https://*) ;; *) echo "PRODUCTION_API_URL must be an https URL"; exit 1;; esac
      - name: Deploy API
        run: npx wrangler deploy --env="" --var PUBLIC_API_URL:"$API_URL"
        working-directory: apps/api
      - name: Build and deploy dashboard
        run: npm run build:cloudflare && npx wrangler deploy --env=""
        working-directory: apps/dashboard
        env:
          VITE_API_URL: ${{ vars.PRODUCTION_API_URL }}
      - name: Health check
        run: |
          for i in $(seq 1 20); do curl -fsS "$API_URL/health/ready" && exit 0; sleep 3; done
          echo "API not ready after deploy"; exit 1

  self-host-image:
    name: Self-hosting Docker image (alternative to Cloudflare)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/api.Dockerfile -t gymverse-api:ci .
      - name: Smoke test API image
        run: |
          docker run -d --name api -e TOKEN_SECRET=ci-secret-ci-secret-ci-secret-ci-secret -e CORS_ORIGINS=https://app.example.com \
            -e SMS_PROVIDER=log -e PAYMENTS_PROVIDER=mock -e ALLOW_INSECURE_PROVIDERS=true -p 4000:4000 gymverse-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/health/ready && exit 0; sleep 1; done
          docker logs api; exit 1
